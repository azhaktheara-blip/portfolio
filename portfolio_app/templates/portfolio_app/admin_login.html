<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0f;--surface:#13131a;--border:rgba(255,255,255,0.07);--accent:#6ee7b7;--text:#e8e8f0;--muted:#6b6b80;--danger:#f87171}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:"DM Sans",sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center}
.wrap{width:100%;max-width:400px;padding:24px}
.logo{font-family:"Syne",sans-serif;font-size:1.4rem;font-weight:800;color:var(--accent);text-align:center;margin-bottom:8px}
.sub{text-align:center;color:var(--muted);font-size:0.88rem;margin-bottom:32px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:32px}
.form-group{margin-bottom:18px}
label{display:block;font-size:0.78rem;font-weight:600;color:var(--muted);letter-spacing:0.06em;text-transform:uppercase;margin-bottom:6px}
input{width:100%;background:#1c1c28;border:1px solid var(--border);border-radius:8px;padding:12px 16px;color:var(--text);font-family:"DM Sans",sans-serif;font-size:0.95rem;outline:none;transition:border-color 0.2s}
input:focus{border-color:var(--accent)}
.btn{width:100%;padding:13px;background:var(--accent);color:#0a0a0f;border:none;border-radius:100px;font-family:"Syne",sans-serif;font-weight:700;font-size:0.95rem;cursor:pointer;margin-top:8px}
.alert{background:rgba(248,113,113,0.1);border:1px solid rgba(248,113,113,0.3);color:var(--danger);padding:10px 14px;border-radius:8px;font-size:0.88rem;margin-bottom:20px}
.back{display:block;text-align:center;color:var(--muted);font-size:0.82rem;margin-top:20px}
.back:hover{color:var(--accent)}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">Admin Panel</div>
  <p class="sub">Sign in to manage your portfolio</p>
  <div class="card">
    {% if messages %}{% for msg in messages %}<div class="alert">{{ msg }}</div>{% endfor %}{% endif %}
    <form method="POST">
      {% csrf_token %}
      <div class="form-group"><label>Username</label><input type="text" name="username" required autofocus></div>
      <div class="form-group"><label>Password</label><input type="password" name="password" required></div>
      <button type="submit" class="btn">Sign In</button>
    </form>
  </div>
  <a href="/" class="back">Back to Portfolio</a>
</div>
</body>
</html>
