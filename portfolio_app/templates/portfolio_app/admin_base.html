<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - {% block title %}{% endblock %}</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0f;--surface:#13131a;--surface2:#1c1c28;--border:rgba(255,255,255,0.07);--accent:#6ee7b7;--accent2:#a78bfa;--text:#e8e8f0;--muted:#6b6b80;--danger:#f87171;--font-head:"Syne",sans-serif;--font-body:"DM Sans",sans-serif}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--font-body);display:flex;min-height:100vh}
a{color:inherit;text-decoration:none}
.sidebar{width:240px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:24px 0;position:fixed;top:0;bottom:0;left:0}
.sidebar-logo{font-family:var(--font-head);font-size:1.1rem;font-weight:800;color:var(--accent);padding:0 24px 24px;border-bottom:1px solid var(--border)}
.sidebar-logo span{display:block;font-size:0.7rem;color:var(--muted);font-weight:400;margin-top:2px}
.nav{padding:16px 0;flex:1}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 24px;color:var(--muted);font-size:0.88rem;font-weight:500;transition:all 0.2s;border-left:3px solid transparent}
.nav-item:hover,.nav-item.active{color:var(--accent);background:rgba(110,231,183,0.06);border-left-color:var(--accent)}
.sidebar-footer{padding:16px 24px;border-top:1px solid var(--border)}
.logout-btn{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:0.85rem;padding:8px 12px;border-radius:8px;transition:all 0.2s;width:100%}
.logout-btn:hover{color:var(--danger)}
.main{margin-left:240px;flex:1;padding:32px}
.page-header{margin-bottom:28px}
.page-title{font-family:var(--font-head);font-size:1.8rem;font-weight:800;letter-spacing:-0.02em}
.page-subtitle{color:var(--muted);font-size:0.9rem;margin-top:4px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px;margin-bottom:24px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.form-group{display:flex;flex-direction:column;gap:6px}
.form-group.full{grid-column:span 2}
label{font-size:0.78rem;font-weight:600;color:var(--muted);letter-spacing:0.06em;text-transform:uppercase}
input,textarea,select{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px 14px;color:var(--text);font-family:var(--font-body);font-size:0.9rem;outline:none;transition:border-color 0.2s;width:100%}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
textarea{resize:vertical;min-height:90px}
select option{background:var(--surface2)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 20px;border-radius:100px;font-family:var(--font-head);font-weight:600;font-size:0.85rem;cursor:pointer;border:none;transition:all 0.2s}
.btn-primary{background:var(--accent);color:#0a0a0f}
.btn-primary:hover{opacity:0.9}
.btn-danger{background:rgba(248,113,113,0.15);color:var(--danger);border:1px solid rgba(248,113,113,0.3)}
.btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--border)}
.btn-ghost:hover{border-color:var(--accent);color:var(--accent)}
.btn-sm{padding:6px 14px;font-size:0.78rem}
table{width:100%;border-collapse:collapse}
th,td{padding:12px 14px;text-align:left;border-bottom:1px solid var(--border);font-size:0.88rem}
th{color:var(--muted);font-size:0.72rem;font-weight:600;letter-spacing:0.08em;text-transform:uppercase}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(255,255,255,0.02)}
.badge{display:inline-block;padding:3px 10px;border-radius:100px;font-size:0.72rem;font-weight:600}
.badge-green{background:rgba(110,231,183,0.12);color:var(--accent)}
.badge-purple{background:rgba(167,139,250,0.12);color:var(--accent2)}
.alert{padding:12px 16px;border-radius:8px;font-size:0.88rem;margin-bottom:20px}
.alert-success{background:rgba(110,231,183,0.1);border:1px solid rgba(110,231,183,0.3);color:var(--accent)}
.alert-error{background:rgba(248,113,113,0.1);border:1px solid rgba(248,113,113,0.3);color:var(--danger)}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:28px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px 24px}
.stat-val{font-family:var(--font-head);font-size:2rem;font-weight:800;color:var(--accent)}
.stat-label{color:var(--muted);font-size:0.82rem;margin-top:4px}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:1000;align-items:center;justify-content:center}
.modal-overlay.open{display:flex}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:28px;width:90%;max-width:560px;max-height:90vh;overflow-y:auto}
.modal-title{font-family:var(--font-head);font-size:1.1rem;font-weight:700;margin-bottom:20px}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}
</style>
</head>
<body>
<aside class="sidebar">
  <div class="sidebar-logo">Admin Panel<span>Portfolio Manager</span></div>
  <nav class="nav">
    <a href="{% url 'admin_dashboard' %}" class="nav-item {% if request.resolver_match.url_name == 'admin_dashboard' %}active{% endif %}">📊 Dashboard</a>
    <a href="{% url 'admin_profile' %}" class="nav-item {% if request.resolver_match.url_name == 'admin_profile' %}active{% endif %}">👤 Profile</a>
    <a href="{% url 'admin_projects' %}" class="nav-item {% if request.resolver_match.url_name == 'admin_projects' %}active{% endif %}">🚀 Projects</a>
    <a href="{% url 'admin_skills' %}" class="nav-item {% if request.resolver_match.url_name == 'admin_skills' %}active{% endif %}">⚡ Skills</a>
    <a href="{% url 'admin_experience' %}" class="nav-item {% if request.resolver_match.url_name == 'admin_experience' %}active{% endif %}">💼 Experience</a>
    <a href="{% url 'admin_messages' %}" class="nav-item {% if request.resolver_match.url_name == 'admin_messages' %}active{% endif %}">✉️ Messages</a>
  </nav>
  <div class="sidebar-footer">
    <a href="/" class="logout-btn">🌐 View Portfolio</a>
    <a href="{% url 'admin_logout' %}" class="logout-btn" style="margin-top:4px">🚪 Logout</a>
  </div>
</aside>
<main class="main">
  {% if messages %}{% for msg in messages %}<div class="alert {% if msg.tags == 'error' %}alert-error{% else %}alert-success{% endif %}">{{ msg }}</div>{% endfor %}{% endif %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
