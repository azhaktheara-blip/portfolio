<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Contact Messages</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
body { background:#0a0a0f; color:#e8e8f0; font-family:'DM Sans',sans-serif; padding:40px; }
h1 { font-family:'Syne',sans-serif; font-size:2rem; color:#6ee7b7; margin-bottom:32px; }
table { width:100%; border-collapse:collapse; }
th, td { padding:12px 16px; text-align:left; border-bottom:1px solid rgba(255,255,255,0.07); font-size:0.9rem; }
th { color:#6ee7b7; font-size:0.75rem; letter-spacing:0.1em; text-transform:uppercase; }
tr:hover td { background:rgba(255,255,255,0.03); }
.back { display:inline-block; margin-bottom:24px; color:#6ee7b7; text-decoration:none; }
</style>
</head>
<body>
<a class="back" href="/">← Back to Portfolio</a>
<h1>Contact Messages ({{ messages|length }})</h1>
{% if messages %}
<table>
  <tr><th>Name</th><th>Email</th><th>Subject</th><th>Message</th><th>Time</th></tr>
  {% for msg in messages %}
  <tr>
    <td>{{ msg.name }}</td>
    <td>{{ msg.email }}</td>
    <td>{{ msg.subject }}</td>
    <td>{{ msg.body|truncatechars:80 }}</td>
    <td>{{ msg.timestamp }}</td>
  </tr>
  {% endfor %}
</table>
{% else %}
<p style="color:#6b6b80">No messages yet.</p>
{% endif %}
</body>
</html>
