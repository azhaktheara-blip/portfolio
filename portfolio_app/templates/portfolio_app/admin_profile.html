{% extends "portfolio_app/admin_base.html" %}
{% block title %}Profile{% endblock %}
{% block content %}
<div class="page-header">
  <h1 class="page-title">Edit Profile</h1>
  <p class="page-subtitle">Update your personal information.</p>
</div>
<div class="card">
  <form method="POST">
    {% csrf_token %}
    <div class="form-grid">
      <div class="form-group"><label>Full Name</label><input type="text" name="name" value="{{ profile.name }}" required></div>
      <div class="form-group"><label>Job Title</label><input type="text" name="title" value="{{ profile.title }}"></div>
      <div class="form-group full"><label>Tagline</label><input type="text" name="tagline" value="{{ profile.tagline }}"></div>
      <div class="form-group full"><label>Bio</label><textarea name="bio" rows="4">{{ profile.bio }}</textarea></div>
      <div class="form-group"><label>Email</label><input type="email" name="email" value="{{ profile.email }}"></div>
      <div class="form-group"><label>Phone</label><input type="text" name="phone" value="{{ profile.phone }}"></div>
      <div class="form-group"><label>Location</label><input type="text" name="location" value="{{ profile.location }}"></div>
      <div class="form-group"><label>GitHub URL</label><input type="url" name="github" value="{{ profile.github }}"></div>
      <div class="form-group"><label>LinkedIn URL</label><input type="url" name="linkedin" value="{{ profile.linkedin }}"></div>
      <div class="form-group"><label>Twitter URL</label><input type="url" name="twitter" value="{{ profile.twitter }}"></div>
    </div>
    <div style="margin-top:24px;display:flex;gap:10px">
      <button type="submit" class="btn btn-primary">Save Profile</button>
      <a href="{% url 'admin_dashboard' %}" class="btn btn-ghost">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
